<script>
                    document.addEventListener('DOMContentLoaded', function() {
                        var calendarEl = document.getElementById('calendar');
                        
                        // Static test data without any Hugo {{ }} tags
                        var eventData = [
                            {
                                title: 'NIGHT RUN KANTO',
                                start: '2026-08-29',
                                url: '#'
                            },
                            {
                                title: 'NIGHT RUN KANSAI',
                                start: '2026-08-29',
                                url: '#'
                            }, // <-- Comma added here!
                            {
                                title: 'TRAIL RUN YOROSAN (CHUBU)',
                                start: '2026-08-14',
                                url: '#'
                            }
                        ];
                
                        var calendar = new FullCalendar.Calendar(calendarEl, {
                            initialView: 'dayGridMonth',
                            events: eventData, 
                            headerToolbar: {
                                left: 'prev,next today',
                                center: 'title',
                                right: 'dayGridMonth,listMonth'
                            }
                        });
                        
                        calendar.render();
                    });
